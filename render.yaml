services:
  - type: web
    name: job-scam-detector-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train_models.py
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
